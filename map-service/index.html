<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moscow Transport Autonomous Map - Test Bench</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(63, 63, 70, 0.8);
      color: #f4f4f5;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      font-size: 13px;
    }
    .status-panel h1 {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: 800;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #3f3f46;
    }
    .bus-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00875A;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(0, 135, 90, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="status-panel">
    <h1><span class="pulse-dot"></span> Автономный картографический стенд Москвы</h1>
    <div>Движок: MapLibre GL JS • Векторные тайлы без зданий</div>
    <div id="telemetry-info" style="margin-top: 4px; color: #a1a1aa;">Симуляция движения: маршрут м3 (Борт №1042)</div>
    <div class="controls">
      <button class="btn" onclick="toggleStyle('transport')">Светлая карта</button>
      <button class="btn" onclick="toggleStyle('transport-dark')">Темная карта</button>
      <button class="btn" onclick="map.flyTo({ center: [37.6850, 55.7745], zoom: 13.5 })">Басманный коридор</button>
    </div>
  </div>

  <script>
    const STYLE_LIGHT = "http://localhost:8085/styles/transport/style.json";
    const STYLE_DARK = "http://localhost:8085/styles/transport-dark/style.json";
    let currentStyle = STYLE_LIGHT;

    const map = new maplibregl.Map({
      container: 'map',
      style: currentStyle,
      center: [37.6176, 55.7558], // Москва
      zoom: 11,
      minZoom: 0,
      maxZoom: 18
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

    function toggleStyle(name) {
      currentStyle = name === 'transport-dark' ? STYLE_DARK : STYLE_LIGHT;
      map.setStyle(currentStyle);
      map.once('style.load', initDynamicLayers);
    }

    // Coordinates path for route m3 simulation
    const m3Path = [
      [37.6420, 55.7580],
      [37.6610, 55.7645],
      [37.6791, 55.7724], // м. Бауманская
      [37.6970, 55.7785], // Бакунинская
      [37.7189, 55.7831], // м. Электрозаводская
      [37.7340, 55.7890]  // м. Семёновская
    ];

    let progress = 0;
    let vehicleCoords = m3Path[0];

    function interpolate(p1, p2, t) {
      return [
        p1[0] + (p2[0] - p1[0]) * t,
        p1[1] + (p2[1] - p1[1]) * t
      ];
    }

    function initDynamicLayers() {
      // 1. Line Route m3
      if (!map.getSource('m3-route')) {
        map.addSource('m3-route', {
          type: 'geojson',
          data: {
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: m3Path
            }
          }
        });

        map.addLayer({
          id: 'm3-route-line',
          type: 'line',
          source: 'm3-route',
          paint: {
            'line-color': '#00875A',
            'line-width': 5,
            'line-opacity': 0.9
          }
        });
      }

      // 2. Moving vehicle GeoJSON source
      if (!map.getSource('vehicle-source')) {
        map.addSource('vehicle-source', {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [{
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: vehicleCoords
              },
              properties: {
                title: 'Борт №1042'
              }
            }]
          }
        });

        map.addLayer({
          id: 'vehicle-point',
          type: 'circle',
          source: 'vehicle-source',
          paint: {
            'circle-radius': 9,
            'circle-color': '#00875A',
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2.5
          }
        });
      }
    }

    map.on('load', () => {
      initDynamicLayers();

      // Periodic update simulation via setData()
      setInterval(() => {
        progress += 0.015;
        if (progress >= m3Path.length - 1) progress = 0;

        const segIdx = Math.floor(progress);
        const segT = progress - segIdx;
        const p1 = m3Path[segIdx];
        const p2 = m3Path[segIdx + 1] || p1;

        vehicleCoords = interpolate(p1, p2, segT);

        const source = map.getSource('vehicle-source');
        if (source) {
          source.setData({
            type: 'FeatureCollection',
            features: [{
              type: 'Feature',
              geometry: {
                type: 'Point',
                coordinates: vehicleCoords
              },
              properties: {
                title: 'Борт №1042'
              }
            }]
          });
        }

        const info = document.getElementById('telemetry-info');
        if (info) {
          info.textContent = `NDTP Онлайн: Борт №1042 (${vehicleCoords[1].toFixed(4)}, ${vehicleCoords[0].toFixed(4)})`;
        }
      }, 100);
    });
  </script>
</body>
</html>
