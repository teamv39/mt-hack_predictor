name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Lab VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Build Go Backend (Linux amd64)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server ./cmd/server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure SSH Multiplexing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          PORT="${{ secrets.SERVER_PORT }}"
          PORT="${PORT:-22}"
          HOST="${{ secrets.SERVER_HOST }}"
          USER="${{ secrets.SERVER_USER }}"

          cat <<EOF > ~/.ssh/config
          Host target-server
            HostName $HOST
            User $USER
            Port $PORT
            IdentityFile ~/.ssh/id_ed25519
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m
            ServerAliveInterval 20
            ServerAliveCountMax 5
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
          EOF

          echo "==> Establishing persistent SSH Master connection..."
          for i in 1 2 3 4 5; do
            if ssh -o ConnectTimeout=20 -f -N target-server </dev/null >/dev/null 2>&1; then
              echo "==> [OK] SSH master connected!"
              break
            else
              echo "Retrying SSH connection in 15s... ($i/5)"
              sleep 15
            fi
          done

          echo "==> Verifying persistent SSH channel..."
          ssh target-server "echo 'SSH Master Ready on \$(hostname)'"

      - name: Deploy Bundle to Server
        run: |
          TARGET_DIR="/home/${{ secrets.SERVER_USER }}/mt-hack_predictor"

          echo "==> Packaging deploy bundle..."
          tar -czf bundle.tar.gz \
            frontend/dist \
            backend/server \
            ml/src \
            ml/pyproject.toml \
            map-service/config.json \
            map-service/styles \
            scripts/deploy.sh

          echo "==> Uploading bundle..."
          scp bundle.tar.gz target-server:${TARGET_DIR}/bundle.tar.gz

          echo "==> Unpacking bundle and running deploy..."
          ssh target-server "tar -xzf ${TARGET_DIR}/bundle.tar.gz -C ${TARGET_DIR} && rm -f ${TARGET_DIR}/bundle.tar.gz && chmod +x ${TARGET_DIR}/scripts/deploy.sh && ${TARGET_DIR}/scripts/deploy.sh"

      - name: Health Check
        run: |
          echo "==> Verifying Services Status via SSH..."
          ssh target-server "curl -f -s http://127.0.0.1:1234/api/v1/status | jq ."
          ssh target-server "curl -f -s http://127.0.0.1:1234/tiles/styles/transport/style.json > /dev/null && echo '==> [OK] TileServer GL is serving vector map styles'"
          ssh target-server "curl -s -I http://127.0.0.1:1234/assets/maplibre-gl-worker.mjs | grep -iq 'application/javascript' && echo '==> [OK] Nginx serves .mjs as application/javascript'"
          ssh target-server "sudo systemctl is-active mt-predictor-backend mt-predictor-ml nginx"
