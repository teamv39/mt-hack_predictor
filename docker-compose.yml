services:
  # Python ML Inference Microservice (CatBoost / SHAP / FastAPI)
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: mt-predictor-ml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - ML_MODELS_DIR=/app/data/models
    restart: unless-stopped
    networks:
      - mt-network

  # High-Performance Go Backend Core (Feeder / Chi / WebSocket Hub)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mt-predictor-backend
    ports:
      - "18081:8080"
      - "9201:9201"
    volumes:
      - ./data:/app/data:ro
      - ./dataset:/app/dataset:ro
    environment:
      - PORT=8080
      - NDTP_PORT=9201
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      - ml
    restart: unless-stopped
    networks:
      - mt-network

  # Official NDTP Telemetry Stream Emulator (Port :18080)
  # Требует предварительной загрузки образа организаторов: docker load -i ndtp-telemetry-emulator.tar
  # Для запуска вместе с эмулятором используйте: docker compose --profile emulator up -d
  ndtp-emu:
    image: ndtp-telemetry-emulator:1.0
    container_name: mt-predictor-ndtp-emu
    profiles:
      - emulator
    ports:
      - "18080:18080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mt-network

  # Situation Center Dashboard (React + MapLibre GL + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mt-predictor-frontend
    ports:
      - "5173:80"
      - "1234:80"
      - "80:80"
    depends_on:
      - backend
      - tileserver
    restart: unless-stopped
    networks:
      - mt-network

  # Vector Tile Builder (Planetiler: used for initial tile build if needed)
  map-builder:
    image: ghcr.io/onthegomap/planetiler:latest
    container_name: mt-predictor-map-builder
    profiles:
      - builder
    restart: "no"
    volumes:
      - ./map-service/data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        TARGET="/data/moscow_transport.mbtiles"
        TARGET_TMP="/data/moscow_transport.mbtiles.tmp"
        OSM_FILE="/data/moscow.osm.pbf"
        URL="https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf"

        rm -f "$$TARGET_TMP"

        if [ -f "$$TARGET" ] && [ -s "$$TARGET" ]; then
          HEADER=$$(head -c 15 "$$TARGET" 2>/dev/null || echo "")
          SIZE=$$(wc -c < "$$TARGET" 2>/dev/null | tr -d ' ' || echo 0)
          if [ "$$HEADER" = "SQLite format 3" ] && [ "$$SIZE" -gt 10000000 ]; then
            echo "==> [Map Builder] Found valid vector tiles ($$SIZE bytes). Skipping build."
            mkdir -p /data/sprites /data/fonts
            exit 0
          else
            echo "==> [Map Builder] Corrupted or incomplete .mbtiles detected ($$SIZE bytes). Removing..."
            rm -f "$$TARGET"
          fi
        fi

        echo "==> [Map Builder] Vector tiles not found! Starting automated map preparation..."
        mkdir -p /data /data/sprites /data/fonts

        if [ ! -f "$$OSM_FILE" ] || [ ! -s "$$OSM_FILE" ]; then
          echo "==> [Map Builder] Step 1/2: Downloading Moscow OSM extract from BBBike (85 MB)..."
          wget -q --show-progress -O "$$OSM_FILE.tmp" "$$URL"
          mv "$$OSM_FILE.tmp" "$$OSM_FILE"
          echo "==> [Map Builder] OSM download complete: $$(du -h "$$OSM_FILE" | cut -f1)"
        else
          echo "==> [Map Builder] Step 1/2: Using existing OSM extract ($$OSM_FILE)."
        fi

        echo "==> [Map Builder] Step 2/2: Building vector tiles via Planetiler..."
        java -Xmx4g -cp @/app/jib-classpath-file com.onthegomap.planetiler.Main \
          --osm-path=$$OSM_FILE \
          --output=$$TARGET_TMP \
          --maxzoom=14 \
          --exclude-layers=building \
          --download \
          --fetch-wikidata=false \
          --force

        mv "$$TARGET_TMP" "$$TARGET"
        chmod 666 "$$TARGET" 2>/dev/null || true
        echo "==> [Map Builder] Vector tiles successfully built: $$(du -h "$$TARGET" | cut -f1)! TileServer can start now."

  # Autonomous Moscow Vector Tile Server (TileServer GL :8085)
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: mt-predictor-tileserver
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./map-service/data:/data
      - ./map-service/styles:/data/styles
      - ./map-service/config.json:/data/config.json
    command: ["--config", "/data/config.json", "-p", "80"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - mt-network

networks:
  mt-network:
    driver: bridge
