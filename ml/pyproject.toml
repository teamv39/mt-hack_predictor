[project]
name = "mt-hack-ml"
version = "0.1.0"
description = "Machine Learning & Feature Engineering pipeline for MT-Hackathon Track 3 (Bus Bunching Predictor)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "catboost>=1.2",
    "lightgbm>=4.0.0",
    "shap>=0.45.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
